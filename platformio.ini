; Wokwi simulator build — Modbus is faked (Wokwi can't drive real RS485).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DUSE_FAKE_MODBUS=1
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    4-20ma/ModbusMaster

; Real-hardware build — reads the Solis inverter over RS485/Modbus,
; and connects to the secured broker over TLS (8883 + per-device auth).
; Flash with:  pio run -e esp32-hw -t upload
[env:esp32-hw]
extends = env:esp32dev
build_flags = -DUSE_FAKE_MODBUS=0 -DUSE_TLS=1
